services:
  - type: web
    name: elora-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: AGNES_API_KEY
        sync: false          # set manually in Render dashboard
      - key: AGNES_BASE_URL
        value: https://apihub.agnes-ai.com/v1
      - key: AGNES_MODEL
        value: agnes-2.5-flash
      - key: FRONTEND_URL
        sync: false          # set after Vercel deploy
      - key: PYTHON_VERSION
        value: "3.11.0"
